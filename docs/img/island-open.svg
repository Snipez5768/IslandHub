<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="Die Insel öffnet sich mit einer Feder zur Musik-Seite und schließt sich wieder">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset=".55" stop-color="#4a3466"/><stop offset="1" stop-color="#8a5a3c"/></linearGradient>
    <linearGradient id="cov" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
  </defs>
  <rect width="520" height="190" rx="16" fill="url(#wall)"/>
  <!-- the island: closed pill → open card (spring overshoot) → closed -->
  <rect y="14" fill="#000" x="172" width="176" height="32" rx="16">
    <animate attributeName="x" dur="5s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;.12;.24;.3;.62;.74;.8;1" values="172;172;64;70;70;174;172;172"
      keySplines=".3 0 .3 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1"/>
    <animate attributeName="width" dur="5s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;.12;.24;.3;.62;.74;.8;1" values="176;176;392;380;380;172;176;176"
      keySplines=".3 0 .3 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1"/>
    <animate attributeName="height" dur="5s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;.12;.24;.3;.62;.74;.8;1" values="32;32;134;128;128;31;32;32"
      keySplines=".3 0 .3 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1"/>
    <animate attributeName="rx" dur="5s" repeatCount="indefinite" keyTimes="0;.12;.24;.62;.74;1" values="16;16;26;26;16;16"/>
  </rect>
  <!-- closed content: cover + equalizer -->
  <g>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;.12;.15;.7;.76;1" values="1;1;0;0;1;1"/>
    <rect x="178" y="20" width="20" height="20" rx="5" fill="url(#cov)"/>
    <g fill="#fff">
      <rect x="318" y="24" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".5s" repeatCount="indefinite" values="5;12;5"/><animate attributeName="y" dur=".5s" repeatCount="indefinite" values="31;24;31"/></rect>
      <rect x="323" y="24" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".62s" repeatCount="indefinite" values="12;4;12"/><animate attributeName="y" dur=".62s" repeatCount="indefinite" values="24;32;24"/></rect>
      <rect x="328" y="24" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".44s" repeatCount="indefinite" values="7;12;7"/><animate attributeName="y" dur=".44s" repeatCount="indefinite" values="29;24;29"/></rect>
      <rect x="333" y="24" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".7s" repeatCount="indefinite" values="10;3;10"/><animate attributeName="y" dur=".7s" repeatCount="indefinite" values="26;33;26"/></rect>
    </g>
  </g>
  <!-- open content: the Musik page (appears while the shape settles) -->
  <g opacity="0" font-family="Segoe UI, SF Pro Text, sans-serif">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;.2;.27;.6;.64;1" values="0;0;1;1;0;0"/>
    <g fill="#636366" font-size="11"><text x="222" y="35">♪  Musik</text></g>
    <rect x="84" y="50" width="78" height="78" rx="12" fill="url(#cov)"/>
    <text x="176" y="66" fill="#fff" font-size="14" font-weight="600">Nachtlicht</text>
    <text x="176" y="82" fill="#98989d" font-size="11">Lena Ost · Spotify</text>
    <rect x="176" y="94" width="250" height="4" rx="2" fill="#2c2c2e"/>
    <rect x="176" y="94" width="96" height="4" rx="2" fill="#0a84ff"/>
    <g fill="#fff"><path d="M262 108 l-9 6 9 6z M252 108 l-9 6 9 6z"/><rect x="290" y="107" width="4" height="14" rx="1"/><rect x="298" y="107" width="4" height="14" rx="1"/><path d="M330 108 l9 6 -9 6z M340 108 l9 6 -9 6z"/></g>
  </g>
</svg>
