<svg xmlns="http://www.w3.org/2000/svg" width="520" height="110" viewBox="0 0 520 110" role="img" aria-label="Claude hört zu: die Insel sagt es selbst, dann bleibt eine orange Welle als Blase daneben">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset=".55" stop-color="#4a3466"/><stop offset="1" stop-color="#8a5a3c"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
  </defs>
  <rect width="520" height="110" rx="16" fill="url(#wall)"/>
  <!-- 0–.12 pill · .12–.55 "Claude hört zu" (wider) · .6–1 pill + wave bubble -->
  <rect y="39" height="32" rx="16" fill="#000" x="172" width="176">
    <animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.1;.18;.55;.63;1" values="172;172;150;150;154;154" keySplines="0 0 1 1;.3 1.25 .5 1;0 0 1 1;.3 1.25 .5 1;0 0 1 1"/>
    <animate attributeName="width" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.1;.18;.55;.63;1" values="176;176;220;220;176;176" keySplines="0 0 1 1;.3 1.25 .5 1;0 0 1 1;.3 1.25 .5 1;0 0 1 1"/>
  </rect>
  <g font-family="Segoe UI, SF Pro Text, sans-serif">
    <!-- the hint -->
    <g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.15;.2;.52;.56;1" values="0;0;1;1;0;0"/>
      <circle cx="171" cy="55" r="11" fill="#ff9f0a" fill-opacity=".18"/>
      <g fill="#ff9f0a">
        <rect x="163.5" y="50" width="2" height="10" rx="1"><animate attributeName="height" dur=".35s" repeatCount="indefinite" values="4;10;4"/><animate attributeName="y" dur=".35s" repeatCount="indefinite" values="53;50;53"/></rect>
        <rect x="167" y="50" width="2" height="10" rx="1"><animate attributeName="height" dur=".28s" repeatCount="indefinite" values="10;3;10"/><animate attributeName="y" dur=".28s" repeatCount="indefinite" values="50;53.5;50"/></rect>
        <rect x="170.5" y="50" width="2" height="10" rx="1"><animate attributeName="height" dur=".4s" repeatCount="indefinite" values="6;10;6"/><animate attributeName="y" dur=".4s" repeatCount="indefinite" values="52;50;52"/></rect>
        <rect x="174" y="50" width="2" height="10" rx="1"><animate attributeName="height" dur=".31s" repeatCount="indefinite" values="9;4;9"/><animate attributeName="y" dur=".31s" repeatCount="indefinite" values="50.5;53;50.5"/></rect>
        <rect x="177.5" y="50" width="2" height="10" rx="1"><animate attributeName="height" dur=".37s" repeatCount="indefinite" values="3;8;3"/><animate attributeName="y" dur=".37s" repeatCount="indefinite" values="53.5;51;53.5"/></rect>
      </g>
      <text x="358" y="60" font-size="13" font-weight="600" text-anchor="end"><tspan fill="#ff9f0a">Claude</tspan><tspan fill="#fff"> hört zu</tspan></text>
    </g>
    <!-- the music pill around it -->
    <g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.1;.13;.58;.62;1" values="1;1;0;0;1;1"/>
      <rect x="160" y="45" width="20" height="20" rx="5" fill="url(#a)"><animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;.5;.62;1" values="178;178;160;160"/></rect>
      <g fill="#fff" opacity=".9"><rect x="302" y="50" width="3" height="10" rx="1.5"/><rect x="307" y="47" width="3" height="13" rx="1.5"/><rect x="312" y="52" width="3" height="8" rx="1.5"/><rect x="317" y="49" width="3" height="11" rx="1.5"/></g>
    </g>
    <!-- the wave lives on as a bubble -->
    <g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.6;.66;.96;1" values="0;0;1;1;0"/>
      <circle cx="353" cy="55" r="16" fill="#000"/>
      <g fill="#ff9f0a">
        <rect x="346" y="49" width="2.5" height="12" rx="1.2"><animate attributeName="height" dur=".33s" repeatCount="indefinite" values="4;12;4"/><animate attributeName="y" dur=".33s" repeatCount="indefinite" values="53;49;53"/></rect>
        <rect x="350.5" y="49" width="2.5" height="12" rx="1.2"><animate attributeName="height" dur=".27s" repeatCount="indefinite" values="12;5;12"/><animate attributeName="y" dur=".27s" repeatCount="indefinite" values="49;52.5;49"/></rect>
        <rect x="355" y="49" width="2.5" height="12" rx="1.2"><animate attributeName="height" dur=".39s" repeatCount="indefinite" values="6;11;6"/><animate attributeName="y" dur=".39s" repeatCount="indefinite" values="52;49.5;52"/></rect>
        <rect x="359.5" y="49" width="2.5" height="12" rx="1.2"><animate attributeName="height" dur=".3s" repeatCount="indefinite" values="10;4;10"/><animate attributeName="y" dur=".3s" repeatCount="indefinite" values="50;53;50"/></rect>
      </g>
    </g>
  </g>
</svg>
