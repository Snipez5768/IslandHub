<svg xmlns="http://www.w3.org/2000/svg" width="520" height="110" viewBox="0 0 520 110" role="img" aria-label="Neuer Song: das alte Cover gleitet raus, das neue federt rein und färbt die Insel kurz">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset=".55" stop-color="#4a3466"/><stop offset="1" stop-color="#8a5a3c"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#30d158"/></linearGradient>
    <clipPath id="pill"><rect x="172" y="39" width="176" height="32" rx="16"/></clipPath>
  </defs>
  <rect width="520" height="110" rx="16" fill="url(#wall)"/>
  <rect x="172" y="39" width="176" height="32" rx="16" fill="#000"/>
  <g clip-path="url(#pill)">
    <!-- short tint in the new cover's colour -->
    <rect x="172" y="39" width="176" height="32" fill="#3fc6a0" opacity="0"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;.25;.32;.45;.55;1" values="0;0;.32;.32;0;0"/></rect>
    <!-- old cover slides out to the left -->
    <rect x="178" y="45" width="20" height="20" rx="5" fill="url(#a)"><animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.38;1" values="0 0;0 0;-30 0;-30 0" keySplines="0 0 1 1;.6 0 .9 .4;0 0 1 1"/><animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;.25;.36;1" values="1;1;0;0"/></rect>
    <!-- new cover springs in from the right, swells once -->
    <g opacity="0"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;.27;.35;.96;1" values="0;0;1;1;0"/>
      <g><animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.27;.42;.48;.55;1" values="30 0;30 0;-3 0;1 0;0 0;0 0" keySplines="0 0 1 1;.3 0 .3 1;.4 0 .6 1;.4 0 .6 1;0 0 1 1"/>
        <rect x="178" y="45" width="20" height="20" rx="5" fill="url(#b)"><animateTransform attributeName="transform" type="scale" additive="sum" dur="4s" repeatCount="indefinite" keyTimes="0;.36;.42;.5;1" values="1;1;1.3;1;1"/></rect>
      </g>
    </g>
    <g fill="#fff">
      <rect x="318" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".5s" repeatCount="indefinite" values="5;12;5"/><animate attributeName="y" dur=".5s" repeatCount="indefinite" values="56;49;56"/></rect>
      <rect x="323" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".62s" repeatCount="indefinite" values="12;4;12"/><animate attributeName="y" dur=".62s" repeatCount="indefinite" values="49;57;49"/></rect>
      <rect x="328" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".44s" repeatCount="indefinite" values="7;12;7"/><animate attributeName="y" dur=".44s" repeatCount="indefinite" values="54;49;54"/></rect>
      <rect x="333" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".7s" repeatCount="indefinite" values="10;3;10"/><animate attributeName="y" dur=".7s" repeatCount="indefinite" values="51;58;51"/></rect>
    </g>
  </g>
</svg>
