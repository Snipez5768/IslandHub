<svg xmlns="http://www.w3.org/2000/svg" width="520" height="110" viewBox="0 0 520 110" role="img" aria-label="Neuer Song: das alte Cover gleitet raus, das neue federt rein, wird kurz größer und färbt die Insel">
  <!-- two songs take turns (8 s): orange → green at 1 s, green → orange at 5 s – the loop has no jump.
       Spline control points stay within 0…1; the overshoot is its own key frame. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset=".55" stop-color="#4a3466"/><stop offset="1" stop-color="#8a5a3c"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#30d158"/></linearGradient>
    <clipPath id="pill"><rect x="172" y="39" width="176" height="32" rx="16"/></clipPath>
  </defs>
  <rect width="520" height="110" rx="16" fill="url(#wall)"/>
  <rect x="172" y="39" width="176" height="32" rx="16" fill="#000"/>
  <g clip-path="url(#pill)">
    <!-- short tint in the new cover's colour -->
    <rect x="172" y="39" width="176" height="32" fill="#3fc6a0" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.13;.17;.24;.3;1" values="0;0;.3;.3;0;0"/></rect>
    <rect x="172" y="39" width="176" height="32" fill="#ff7a3c" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.63;.67;.74;.8;1" values="0;0;.3;.3;0;0"/></rect>

    <!-- orange: leaves to the left at 1 s, comes back from the right at 5 s -->
    <g transform="translate(188 55)">
      <g><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="spline"
            keyTimes="0;.125;.19;.6;.635;.7;.73;.77;1" values="0 0;0 0;-30 0;-30 0;30 0;-3 0;1 0;0 0;0 0"
            keySplines="0 0 1 1;.6 0 .9 .4;0 0 1 1;0 0 1 1;.3 0 .3 1;.4 0 .6 1;.4 0 .6 1;0 0 1 1"/>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.125;.18;.635;.67;1" values="1;1;0;0;1;1"/>
        <g><animateTransform attributeName="transform" type="scale" dur="8s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;.68;.71;.75;1" values="1;1;1.3;1;1" keySplines="0 0 1 1;.4 0 .6 1;.3 0 .3 1;0 0 1 1"/>
          <rect x="-10" y="-10" width="20" height="20" rx="5" fill="url(#a)"/></g>
      </g>
    </g>

    <!-- green: comes in from the right at 1 s, leaves to the left at 5 s -->
    <g transform="translate(188 55)">
      <g><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="spline"
            keyTimes="0;.135;.2;.23;.27;.625;.69;1" values="30 0;30 0;-3 0;1 0;0 0;0 0;-30 0;30 0"
            keySplines="0 0 1 1;.3 0 .3 1;.4 0 .6 1;.4 0 .6 1;0 0 1 1;.6 0 .9 .4;0 0 1 1"/>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.135;.17;.625;.68;1" values="0;0;1;1;0;0"/>
        <g><animateTransform attributeName="transform" type="scale" dur="8s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;.18;.21;.25;1" values="1;1;1.3;1;1" keySplines="0 0 1 1;.4 0 .6 1;.3 0 .3 1;0 0 1 1"/>
          <rect x="-10" y="-10" width="20" height="20" rx="5" fill="url(#b)"/></g>
      </g>
    </g>

    <g fill="#fff">
      <rect x="318" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".5s" repeatCount="indefinite" values="5;12;5"/><animate attributeName="y" dur=".5s" repeatCount="indefinite" values="56;49;56"/></rect>
      <rect x="323" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".62s" repeatCount="indefinite" values="12;4;12"/><animate attributeName="y" dur=".62s" repeatCount="indefinite" values="49;57;49"/></rect>
      <rect x="328" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".44s" repeatCount="indefinite" values="7;12;7"/><animate attributeName="y" dur=".44s" repeatCount="indefinite" values="54;49;54"/></rect>
      <rect x="333" y="49" width="3" height="12" rx="1.5"><animate attributeName="height" dur=".7s" repeatCount="indefinite" values="10;3;10"/><animate attributeName="y" dur=".7s" repeatCount="indefinite" values="51;58;51"/></rect>
    </g>
  </g>
</svg>
