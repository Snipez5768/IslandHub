<svg xmlns="http://www.w3.org/2000/svg" width="520" height="180" viewBox="0 0 520 180" role="img" aria-label="Der eingefräste Umschalter Timer | Wecker wechselt die Räder zwischen Dauer und Uhrzeit">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset=".55" stop-color="#4a3466"/><stop offset="1" stop-color="#8a5a3c"/></linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#020203"/><stop offset=".45" stop-color="#08080a"/><stop offset="1" stop-color="#141416"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".35" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5a5f"/><stop offset=".55" stop-color="#434347"/><stop offset="1" stop-color="#38383b"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".9"/></filter>
  </defs>
  <rect width="520" height="180" rx="16" fill="url(#wall)"/>
  <rect x="70" y="14" width="380" height="128" rx="26" fill="#000"/>
  <g font-family="Segoe UI, SF Pro Text, sans-serif">
    <!-- the milled groove -->
    <rect x="84" y="22" width="120" height="22" rx="11" fill="url(#groove)"/>
    <rect x="84" y="22" width="120" height="22" rx="11" fill="url(#shade)"/>
    <path d="M95 43.5 H193" stroke="#ffffff22" stroke-width="1"/>
    <rect y="24" height="18" rx="9" fill="url(#thumb)" filter="url(#drop)" x="86" width="52">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.4;.45;.48;.9;.95;.98;1" values="86;86;145;140;140;81;86;86" keySplines="0 0 1 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;.4;.48;.9;.98;1" values="52;52;62;62;52;52"/>
    </rect>
    <path d="M90 24.6 H134" stroke="#ffffff40" stroke-width=".8"><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.4;.45;.48;.9;.95;.98;1" values="0 0;0 0;59 0;54 0;54 0;-5 0;0 0;0 0" keySplines="0 0 1 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1;.3 0 .3 1;.4 0 .6 1;0 0 1 1"/></path>
    <text x="112" y="37.5" font-size="12" font-weight="600" text-anchor="middle" fill="#fff"><animate attributeName="fill" dur="6s" repeatCount="indefinite" keyTimes="0;.42;.46;.92;.96;1" values="#fff;#fff;#6e6e73;#6e6e73;#fff;#fff"/>Timer</text>
    <text x="171" y="37.5" font-size="12" font-weight="600" text-anchor="middle" fill="#6e6e73"><animate attributeName="fill" dur="6s" repeatCount="indefinite" keyTimes="0;.42;.46;.92;.96;1" values="#6e6e73;#6e6e73;#fff;#fff;#6e6e73;#6e6e73"/>Wecker</text>
    <!-- wheels -->
    <rect x="80" y="76" width="150" height="26" rx="13" fill="#2c2c2e"/>
    <g font-size="18" fill="#fff">
      <g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.43;.455;.94;.975;1" values="1;1;0;0;1;1"/><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.43;.47;.93;.94;.98;1" values="0 0;0 0;0 -16;0 -16;0 16;0 0;0 0" keySplines="0 0 1 1;.5 0 .7 1;0 0 1 1;0 0 1 1;.3 0 .3 1;0 0 1 1"/>
        <text x="96" y="95">0</text><text x="110" y="95" font-size="12" fill="#98989d">h</text><text x="128" y="95">25</text><text x="152" y="95" font-size="12" fill="#98989d">m</text><text x="172" y="95">0</text><text x="186" y="95" font-size="12" fill="#98989d">s</text>
        <g font-size="12" fill="#48484a"><text x="128" y="72">24</text><text x="128" y="118">26</text></g></g>
      <g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.455;.49;.93;.955;1" values="0;0;1;1;0;0"/>
        <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.44;.48;.93;.97;1" values="0 16;0 16;0 0;0 0;0 -16;0 -16" keySplines="0 0 1 1;.3 0 .3 1;0 0 1 1;.5 0 .7 1;0 0 1 1"/>
        <text x="96" y="95">07</text><text x="122" y="95">:</text><text x="132" y="95">30</text><text x="158" y="95" font-size="12" fill="#98989d">Uhr</text>
        <g font-size="12" fill="#48484a"><text x="98" y="72">06</text><text x="98" y="118">08</text><text x="134" y="72">29</text><text x="134" y="118">31</text></g></g>
    </g>
    <!-- button: green Start / orange Stellen -->
    <rect x="290" y="70" width="104" height="30" rx="15" fill="#30d15840"><animate attributeName="fill" dur="6s" repeatCount="indefinite" keyTimes="0;.44;.47;.94;.97;1" values="#30d15840;#30d15840;#ff9f0a40;#ff9f0a40;#30d15840;#30d15840"/></rect>
    <text x="342" y="90" font-size="13" font-weight="600" text-anchor="middle" fill="#30d158"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.44;.47;.94;.97;1" values="1;1;0;0;1;1"/>Start</text>
    <text x="342" y="90" font-size="13" font-weight="600" text-anchor="middle" fill="#ff9f0a" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.45;.48;.93;.96;1" values="0;0;1;1;0;0"/>Stellen</text>
    <text x="342" y="120" font-size="11" text-anchor="middle" fill="#98989d"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.44;.47;.94;.97;1" values="1;1;0;0;1;1"/>5 · 10 · 25 Min</text>
    <text x="342" y="120" font-size="11" text-anchor="middle" fill="#98989d" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.45;.48;.93;.96;1" values="0;0;1;1;0;0"/>6:30 · 7:00 · 8:00</text>
  </g>
</svg>
