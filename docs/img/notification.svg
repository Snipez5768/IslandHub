<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-label="Eine Nachricht: Glocke schwingt, schmale Laufzeile, dann die Karte">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset=".55" stop-color="#4a3466"/><stop offset="1" stop-color="#8a5a3c"/></linearGradient>
    <linearGradient id="cov" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
    <clipPath id="line"><rect x="208" y="16" width="190" height="30"/></clipPath>
  </defs>
  <rect width="520" height="170" rx="16" fill="url(#wall)"/>
  <!-- 0–1.1 s bell · 1.1–4 s ticker (grows sideways) · 4–7 s card (pointer on it) · back -->
  <rect fill="#000" x="172" y="14" width="176" height="32" rx="16">
    <animate attributeName="x" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.14;.2;.5;.58;.9;.96;1" values="172;172;95;95;85;85;172;172" keySplines=".3 0 .3 1;.3 0 .3 1;0 0 1 1;.3 0 .3 1;0 0 1 1;.3 0 .3 1;0 0 1 1"/>
    <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.14;.2;.5;.58;.9;.96;1" values="176;176;330;330;350;350;176;176" keySplines=".3 0 .3 1;.3 0 .3 1;0 0 1 1;.3 0 .3 1;0 0 1 1;.3 0 .3 1;0 0 1 1"/>
    <animate attributeName="height" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.14;.2;.5;.58;.9;.96;1" values="32;32;32;32;84;84;32;32" keySplines=".3 0 .3 1;.3 0 .3 1;0 0 1 1;.3 0 .3 1;0 0 1 1;.3 0 .3 1;0 0 1 1"/>
    <animate attributeName="rx" dur="8s" repeatCount="indefinite" keyTimes="0;.5;.58;.9;.96;1" values="16;16;28;28;16;16"/>
  </rect>
  <!-- closed: cover, then the bell swings where the equalizer was -->
  <g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.13;.15;.97;1" values="1;1;0;0;1"/>
    <rect x="178" y="20" width="20" height="20" rx="5" fill="url(#cov)"/>
    <g transform="translate(330 23)">
      <g><animateTransform attributeName="transform" type="rotate" dur="8s" repeatCount="indefinite" keyTimes="0;.02;.04;.06;.08;.1;.12;1" values="0 0 0;-18 0 0;16 0 0;-12 0 0;8 0 0;-4 0 0;0 0 0;0 0 0"/>
        <path d="M-6 9 V3 a6 6 0 0 1 12 0 V9 l1.5 1.5 H-7.5z M-2 13 a2.2 2.2 0 0 0 4 0" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <!-- ticker: avatar, the line runs through once -->
  <g font-family="Segoe UI, SF Pro Text, sans-serif" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.17;.21;.5;.53;1" values="0;0;1;1;0;0"/>
    <circle cx="113" cy="30" r="12" fill="#30d158"/><text x="113" y="34" fill="#04342c" font-size="11" font-weight="700" text-anchor="middle">A</text>
    <g clip-path="url(#line)" transform="translate(-74 0)"><g><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;.3;.48;1" values="0 0;0 0;-90 0;-90 0"/>
      <text x="208" y="34.5" font-size="12.5"><tspan fill="#fff" font-weight="600">Anna</tspan><tspan fill="#c7c7cc">  Kommst du heute noch vorbei? Ich bring Pizza mit</tspan></text></g></g>
    <circle cx="407" cy="30" r="8" fill="#30d158" opacity=".9"/>
  </g>
  <!-- the card -->
  <g font-family="Segoe UI, SF Pro Text, sans-serif" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.55;.6;.88;.9;1" values="0;0;1;1;0;0"/>
    <text x="146" y="34" fill="#98989d" font-size="10.5">WhatsApp · jetzt</text>
    <circle cx="121" cy="57" r="18" fill="#30d158"/><text x="121" y="62" fill="#04342c" font-size="14" font-weight="700" text-anchor="middle">A</text>
    <text x="146" y="54" fill="#fff" font-size="13" font-weight="600">Anna</text>
    <text x="146" y="70" fill="#aeaeb2" font-size="11.5">Kommst du heute noch vorbei?</text>
    <circle cx="371" cy="57" r="15" fill="#2c2c2e"/><path d="M365 57 l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="405" cy="57" r="15" fill="#30d158"/><path d="M400 62 l9-9 M403 53 h6 v6" fill="none" stroke="#04342c" stroke-width="2" stroke-linecap="round"/>
    <rect x="113" y="95" width="290" height="2" rx="1" fill="#ffffff66"><animate attributeName="width" dur="8s" repeatCount="indefinite" keyTimes="0;.62;.9;1" values="290;290;0;0"/></rect>
  </g>
  <!-- the pointer -->
  <g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.45;.48;.88;.9;1" values="0;0;1;1;0;0"/>
    <path transform="translate(300 34)" d="M0 0 L0 16 L4.5 12 L7.5 18.5 L10 17.3 L7 11 L13 11 Z" fill="#fff" stroke="#000" stroke-width="1"><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;.45;.52;1" values="330 120;330 120;300 34;300 34"/></path>
  </g>
</svg>
